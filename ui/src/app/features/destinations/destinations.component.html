<div class="page-header">
  <h1>Destinos</h1>
  @if (canManage()) {
    <button mat-flat-button color="primary" (click)="create()">
      <mat-icon>add</mat-icon>
      Nuevo destino
    </button>
  }
</div>

<table mat-table [dataSource]="destinations()" class="mat-elevation-z1 full-width">
  <ng-container matColumnDef="destination_id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let d">{{ d.destination_id }}</td>
  </ng-container>
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let d">{{ d.name }}</td>
  </ng-container>
  <ng-container matColumnDef="adapter">
    <th mat-header-cell *matHeaderCellDef>Adapter</th>
    <td mat-cell *matCellDef="let d">{{ d.adapter }}</td>
  </ng-container>
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let d">
      <app-status-badge [state]="d.paused ? 'paused' : d.enabled ? 'ok' : 'down'" />
    </td>
  </ng-container>
  <ng-container matColumnDef="format">
    <th mat-header-cell *matHeaderCellDef>Formato</th>
    <td mat-cell *matCellDef="let d">{{ d.format }}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let d">
      @if (canManage()) {
        <button mat-icon-button matTooltip="Probar conexion" (click)="test(d)"><mat-icon>network_check</mat-icon></button>
        <button mat-icon-button matTooltip="Editar" (click)="edit(d)"><mat-icon>edit</mat-icon></button>
      }
      @if (canOperate()) {
        <button mat-icon-button [matTooltip]="d.paused ? 'Reanudar' : 'Pausar'" (click)="togglePause(d)">
          <mat-icon>{{ d.paused ? 'play_arrow' : 'pause' }}</mat-icon>
        </button>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
@if (destinations().length === 0) {
  <p>No hay destinos configurados todavia.</p>
}
