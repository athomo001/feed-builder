########################################################################
# HUB (esta integracion)
########################################################################
# Este compose levanta el Hub de distribucion de IOC (el paquete hub/,
# reemplazo del script legado opencti_feed_builder.py) de forma
# STANDALONE: no necesita saber nada de OpenCTI para arrancar. La conexion
# (URL, token, TLS, stream_id) se configura despues, en caliente, desde la
# Admin UI (pantalla "Conexion OpenCTI") -- ver hub/opencti_settings_store.py.
# Como la conexion es una llamada HTTPS saliente normal (no una
# dependencia de red Docker compartida con OpenCTI), no hace falta unirse
# a ninguna red externa ni conocer el nombre de la red Docker de OpenCTI.
#
# Variables de entorno compartidas entre hub-service y hub-api (no llevan
# "x-" un significado especial para Compose -- es la convencion para
# bloques reusables via el merge key YAML "<<", asi no se repite cada
# variable en los dos servicios). Cada servicio solo agrega abajo lo que
# le es propio (puerto, OIDC, etc.).
x-hub-common-env: &hub-common-env
  HUB_STATE_DIR: /state
  TXT_FEED_DIR: /feeds
  ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
  ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-25}
  ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
  ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
  ALERT_EMAIL_CREDENTIAL_REF: ${ALERT_EMAIL_CREDENTIAL_REF:-}
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  ALERT_WEBHOOK_CREDENTIAL_REF: ${ALERT_WEBHOOK_CREDENTIAL_REF:-}
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:

  hub-service:
    image: python:3.12-slim
    restart: always
    environment:
      <<: *hub-common-env
      HUB_SOURCE_ID: ${HUB_SOURCE_ID:-opencti-main}
      RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS:-600}
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-300}
    volumes:
      - ${HUB_APP_PATH:-.}:/app:ro
      - hub_state:/state
      - hub_feeds:/feeds
    working_dir: /app
    command: >
      sh -lc '
        set -eux;
        pip install --no-cache-dir -r hub/requirements.txt;
        exec python -m hub.service
      '
    healthcheck:
      test: ["CMD", "python", "-m", "hub.service", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hub-net
    mem_limit: ${HUB_SERVICE_MEM_LIMIT:-512m}
    cpus: ${HUB_SERVICE_CPU_LIMIT:-1.0}

  hub-api:
    image: python:3.12-slim
    restart: always
    depends_on:
      hub-service:
        condition: service_started
    environment:
      <<: *hub-common-env
      HUB_API_HOST: 0.0.0.0
      HUB_API_PORT: 8000
      # Por defecto, el mismo origen donde nginx sirve la UI y expone
      # /admin/api/ (mismo origen = el navegador ni pide CORS). Solo hace
      # falta declarar ADMIN_UI_ORIGINS en .env si la UI se sirve desde
      # otro origen (por ejemplo, `ng serve` en desarrollo).
      ADMIN_UI_ORIGINS: ${ADMIN_UI_ORIGINS:-https://${PUBLIC_HOST}:${NGINX_HTTPS_PORT:-8446}}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET_REF: ${OIDC_CLIENT_SECRET_REF:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_ROLE_MAPPING: ${OIDC_ROLE_MAPPING:-}
    volumes:
      - ${HUB_APP_PATH:-.}:/app:ro
      - hub_state:/state
      - hub_feeds:/feeds
    working_dir: /app
    command: >
      sh -lc '
        set -eux;
        pip install --no-cache-dir -r hub/requirements.txt;
        exec python -m hub.api
      '
    healthcheck:
      # python:3.12-slim no trae curl/wget -- se usa urllib (ya en la
      # imagen base) contra el mismo endpoint que expone /healthz/ en nginx.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/liveness', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hub-net
    mem_limit: ${HUB_API_MEM_LIMIT:-512m}
    cpus: ${HUB_API_CPU_LIMIT:-1.0}

  nginx:
    image: nginx:stable
    restart: always
    environment:
      - PUBLIC_HOST=${PUBLIC_HOST}
      - NGINX_HTTPS_PORT=${NGINX_HTTPS_PORT:-8446}
    entrypoint: ["/bin/sh", "-c"]
    # command como lista de UN elemento: si fuera un string plano, Compose lo
    # parte con shlex antes de pasarlo a "sh -c", y "<"/">"/"&&" dejan de
    # interpretarse como shell (se pasan como argv sueltos a sh -c, que solo
    # ejecuta el primer argumento). Con un solo elemento no hay split.
    command: ["envsubst '$$PUBLIC_HOST $$NGINX_HTTPS_PORT' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    ports:
      - "${NGINX_HTTPS_PORT:-8446}:443"
    volumes:
      - ${NGINX_CONF_PATH:-./nginx.conf}:/etc/nginx/nginx.conf.template:ro
      - ${NGINX_CERTS_PATH:-./certs}:/etc/nginx/certs:ro
      - hub_feeds:/usr/share/nginx/html/feeds:ro
      - ${UI_DIST_PATH:-./ui/dist/ui/browser}:/usr/share/nginx/html/ui:ro
    healthcheck:
      # -k porque el certificado puede ser autofirmado; ejercita TLS +
      # el reverse-proxy a hub-api en un solo golpe (nginx:stable trae curl).
      test: ["CMD", "curl", "-fsk", "https://localhost/healthz/liveness"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      hub-api:
        condition: service_healthy
    networks:
      - hub-net
    mem_limit: ${NGINX_MEM_LIMIT:-256m}
    cpus: ${NGINX_CPU_LIMIT:-0.50}

volumes:
  hub_state:
  hub_feeds:

networks:
  # Pre-creada a mano UNA sola vez (`docker network create hub-net`, ver
  # README.md #5) en vez de dejar que Compose la cree/borre en cada
  # up/down: crear una red Docker regenera las reglas de iptables del host
  # (cadenas DOCKER/FORWARD/NAT), lo que en hosts con muchas redes ya
  # corriendo puede resetear brevemente conexiones TCP establecidas del
  # host (ej. tu propia sesion SSH). Marcandola external, ese evento pasa
  # una unica vez al crear la red a mano, no en cada `docker compose up`.
  hub-net:
    external: true
