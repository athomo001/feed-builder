# Respaldo/plantilla de los servicios del Hub (ver README.md seccion 9).
# Compose independiente y ejecutable:
#   docker compose -f feed-builder.yml up -d
# Sirve para recuperar rapidamente estos dos servicios si el compose
# principal (docker-compose.yml) se pierde o queda en mal estado --
# mantener sincronizado con el cuando cambien variables, volumenes o
# command de hub-service/hub-api.
services:
  hub-service:
    image: python:3.12-slim
    restart: always
    environment:
      - OPENCTI_URL=${OPENCTI_URL}
      - OPENCTI_SERVICE_ACCOUNT_TOKEN=${OPENCTI_SERVICE_ACCOUNT_TOKEN}
      - OPENCTI_STREAM_ID=${OPENCTI_STREAM_ID}
      - OPENCTI_TLS_VERIFY=${OPENCTI_TLS_VERIFY:-true}
      - HUB_STATE_DIR=/state
      - TXT_FEED_DIR=/feeds
      - HUB_SOURCE_ID=${HUB_SOURCE_ID:-opencti-main}
    volumes:
      - ${HUB_APP_PATH}:/app:ro
      - hub_state:/state
      - hub_feeds:/feeds
    working_dir: /app
    command: >
      sh -lc '
        set -eux;
        pip install --no-cache-dir -r hub/requirements.txt;
        exec python -m hub.service
      '
    healthcheck:
      test: ["CMD", "python", "-m", "hub.service", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hub-net
      - opencti-net

  hub-api:
    image: python:3.12-slim
    restart: always
    depends_on:
      hub-service:
        condition: service_started
    environment:
      - OPENCTI_URL=${OPENCTI_URL}
      - OPENCTI_SERVICE_ACCOUNT_TOKEN=${OPENCTI_SERVICE_ACCOUNT_TOKEN}
      - HUB_STATE_DIR=/state
      - TXT_FEED_DIR=/feeds
      - HUB_API_HOST=0.0.0.0
      - HUB_API_PORT=8000
      - ADMIN_UI_ORIGINS=${ADMIN_UI_ORIGINS}
    volumes:
      - ${HUB_APP_PATH}:/app:ro
      - hub_state:/state
      - hub_feeds:/feeds
    working_dir: /app
    command: >
      sh -lc '
        set -eux;
        pip install --no-cache-dir -r hub/requirements.txt;
        exec python -m hub.api
      '
    networks:
      - hub-net

volumes:
  hub_state:
  hub_feeds:

networks:
  hub-net:
    driver: bridge
  # Solo necesaria si el Hub esta co-ubicado en el mismo host que OpenCTI;
  # si es remoto sobre HTTPS, borrar esta red de "networks:" en ambos
  # servicios y de esta seccion.
  opencti-net:
    external: true
    name: ${OPENCTI_DOCKER_NETWORK:-opencti-net}
