services:

  ###########################
  # HUB (esta integracion)  #
  ###########################
  # Este compose levanta SOLO el Hub de distribucion de IOC (el paquete
  # hub/, reemplazo del script legado opencti_feed_builder.py). OpenCTI ya
  # esta desplegado por su cuenta -- este proyecto es una integracion sobre
  # el, no un despliegue de OpenCTI en si. Si OpenCTI corre en un Docker
  # host distinto, alcanza con configurar OPENCTI_URL/PUBLIC_HOST en .env y
  # borrar el bloque "external network" de abajo. Si corre co-ubicado en el
  # mismo host, unirse a la red externa de OpenCTI (OPENCTI_DOCKER_NETWORK)
  # deja resolver su nombre de servicio directo.

  hub-service:
    image: python:3.12-slim
    restart: always
    environment:
      - OPENCTI_URL=${OPENCTI_URL}
      - OPENCTI_SERVICE_ACCOUNT_TOKEN=${OPENCTI_SERVICE_ACCOUNT_TOKEN}
      - OPENCTI_STREAM_ID=${OPENCTI_STREAM_ID}
      - OPENCTI_TLS_VERIFY=${OPENCTI_TLS_VERIFY:-true}
      - HUB_STATE_DIR=/state
      - TXT_FEED_DIR=/feeds
      - HUB_SOURCE_ID=${HUB_SOURCE_ID:-opencti-main}
      - RECONCILE_INTERVAL_SECONDS=${RECONCILE_INTERVAL_SECONDS:-600}
      - ALERT_COOLDOWN_SECONDS=${ALERT_COOLDOWN_SECONDS:-300}
      - ALERT_SMTP_HOST=${ALERT_SMTP_HOST}
      - ALERT_SMTP_PORT=${ALERT_SMTP_PORT:-25}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO}
      - ALERT_EMAIL_CREDENTIAL_REF=${ALERT_EMAIL_CREDENTIAL_REF}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}
      - ALERT_WEBHOOK_CREDENTIAL_REF=${ALERT_WEBHOOK_CREDENTIAL_REF}
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
    volumes:
      - ${HUB_APP_PATH}:/app:ro
      - hub_state:/state
      - hub_feeds:/feeds
    working_dir: /app
    command: >
      sh -lc '
        set -eux;
        pip install --no-cache-dir -r hub/requirements.txt;
        exec python -m hub.service
      '
    healthcheck:
      test: ["CMD", "python", "-m", "hub.service", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hub-net
      - opencti-net
    mem_limit: ${HUB_SERVICE_MEM_LIMIT:-512m}
    cpus: ${HUB_SERVICE_CPU_LIMIT:-1.0}

  hub-api:
    image: python:3.12-slim
    restart: always
    depends_on:
      hub-service:
        condition: service_started
    environment:
      - OPENCTI_URL=${OPENCTI_URL}
      - OPENCTI_SERVICE_ACCOUNT_TOKEN=${OPENCTI_SERVICE_ACCOUNT_TOKEN}
      - OPENCTI_TLS_VERIFY=${OPENCTI_TLS_VERIFY:-true}
      - HUB_STATE_DIR=/state
      - TXT_FEED_DIR=/feeds
      - HUB_API_HOST=0.0.0.0
      - HUB_API_PORT=8000
      - ADMIN_UI_ORIGINS=${ADMIN_UI_ORIGINS}
      - ALERT_SMTP_HOST=${ALERT_SMTP_HOST}
      - ALERT_SMTP_PORT=${ALERT_SMTP_PORT:-25}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO}
      - ALERT_EMAIL_CREDENTIAL_REF=${ALERT_EMAIL_CREDENTIAL_REF}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}
      - ALERT_WEBHOOK_CREDENTIAL_REF=${ALERT_WEBHOOK_CREDENTIAL_REF}
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET_REF=${OIDC_CLIENT_SECRET_REF}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI}
      - OIDC_ROLE_MAPPING=${OIDC_ROLE_MAPPING}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
    volumes:
      - ${HUB_APP_PATH}:/app:ro
      - hub_state:/state
      - hub_feeds:/feeds
    working_dir: /app
    command: >
      sh -lc '
        set -eux;
        pip install --no-cache-dir -r hub/requirements.txt;
        exec python -m hub.api
      '
    healthcheck:
      # python:3.12-slim no trae curl/wget -- se usa urllib (ya en la
      # imagen base) contra el mismo endpoint que expone /healthz/ en nginx.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/liveness', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hub-net
    mem_limit: ${HUB_API_MEM_LIMIT:-512m}
    cpus: ${HUB_API_CPU_LIMIT:-1.0}

  nginx:
    image: nginx:stable
    restart: always
    environment:
      - PUBLIC_HOST=${PUBLIC_HOST}
      - NGINX_HTTPS_PORT=${NGINX_HTTPS_PORT}
    entrypoint: ["/bin/sh", "-c"]
    # command como lista de UN elemento: si fuera un string plano, Compose lo
    # parte con shlex antes de pasarlo a "sh -c", y "<"/">"/"&&" dejan de
    # interpretarse como shell (se pasan como argv sueltos a sh -c, que solo
    # ejecuta el primer argumento). Con un solo elemento no hay split.
    command: ["envsubst '$$PUBLIC_HOST $$NGINX_HTTPS_PORT' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    ports:
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ${NGINX_CONF_PATH}:/etc/nginx/nginx.conf.template:ro
      - ${NGINX_CERTS_PATH}:/etc/nginx/certs:ro
      - hub_feeds:/usr/share/nginx/html/feeds:ro
      - ${UI_DIST_PATH}:/usr/share/nginx/html/ui:ro
    healthcheck:
      # -k porque el certificado puede ser autofirmado; ejercita TLS +
      # el reverse-proxy a hub-api en un solo golpe (nginx:stable trae curl).
      test: ["CMD", "curl", "-fsk", "https://localhost/healthz/liveness"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      hub-api:
        condition: service_healthy
    networks:
      - hub-net
    mem_limit: ${NGINX_MEM_LIMIT:-256m}
    cpus: ${NGINX_CPU_LIMIT:-0.50}

volumes:
  hub_state:
  hub_feeds:

networks:
  hub-net:
    driver: bridge
  # Red de la instalacion de OpenCTI ya desplegada por separado (topologia
  # "co-ubicado", spec/03-ARCHITECTURE.md). Si OpenCTI es remoto (otro
  # Docker host, sobre HTTPS), borrar esta red del "networks:" de arriba en
  # hub-service y esta seccion entera.
  opencti-net:
    external: true
    name: ${OPENCTI_DOCKER_NETWORK:-opencti-net}
