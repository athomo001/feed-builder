events {
    worker_connections 1024;
}

http {
    # Sin esto, nginx sirve TODO con su Content-Type compilado por defecto
    # (text/plain) -- rompe la carga de los .js de la UI Angular como modulos
    # ES (el navegador exige el MIME type correcto para <script type="module">).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # server_name/puerto se resuelven via envsubst al arrancar el contenedor
    # (ver servicio "nginx" en docker-compose.yml): este archivo se monta como
    # /etc/nginx/nginx.conf.template y ${PUBLIC_HOST}/${NGINX_HTTPS_PORT} se
    # completan desde .env antes de lanzar nginx. No hardcodear IPs/host aca.
    #
    # Este es el ingress PROPIO del Hub -- nunca comparte nginx con el de la
    # instalacion de OpenCTI (que corre aparte, con su propio ingress).

    server {
        listen 80;
        server_name ${PUBLIC_HOST};
        return 301 https://$host:${NGINX_HTTPS_PORT}$request_uri;
    }

    server {
        listen 443 ssl;
        server_name ${PUBLIC_HOST};

        ssl_certificate /etc/nginx/certs/${PUBLIC_HOST}.crt;
        ssl_certificate_key /etc/nginx/certs/${PUBLIC_HOST}.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 20M;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        send_timeout 120s;

        # `proxy_pass http://hub-api:8000` con el hostname literal resuelve
        # el DNS UNA sola vez, al arrancar el worker de nginx, y lo cachea
        # para siempre -- si se reinicia hub-api (u otro contenedor) despues
        # y Docker le asigna una IP nueva, nginx sigue mandando trafico a la
        # IP vieja indefinidamente ("connect() failed: Connection refused")
        # hasta que alguien reinicia nginx tambien. Bug real (2026-08-18):
        # pasó dos veces reiniciando solo el backend. `resolver` (el DNS
        # embebido de Docker, siempre en 127.0.0.11 dentro de una red
        # user-defined) + pasar la URL por una variable (no un literal en
        # `proxy_pass`) fuerza a nginx a resolver de nuevo cada `valid`
        # segundos en vez de una sola vez para toda la vida del proceso.
        resolver 127.0.0.11 valid=10s;

        # Feeds materializados (file_feed: Fortinet, Palo Alto EDL,
        # pfSense/pfBlockerNG, Cisco Security Intelligence, Check Point CSV,
        # MikroTik .rsc, Wazuh CDB, bundle STIX) -> /feeds/<destino>/<archivo>.
        # Un IOC de red que hace poll a esta URL nunca debe llegar sin algun
        # control de acceso (spec/05 "escalera de autenticacion"). Falta
        # implementar: no hay generacion automatica de un htpasswd por
        # destino desde los secretos del Hub todavia -- si se necesita Basic
        # Auth por destino, agregar `auth_basic`/`auth_basic_user_file` a
        # mano hasta que exista esa integracion.
        location ^~ /feeds/ {
            root /usr/share/nginx/html;
            default_type text/plain;
            charset utf-8;
            add_header Cache-Control "no-cache";
            autoindex off;
            try_files $uri =404;
        }

        # Admin API + servidor TAXII + healthchecks -> hub-api (FastAPI).
        location ^~ /admin/api/ {
            set $hub_api http://hub-api:8000;
            proxy_pass $hub_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ^~ /taxii2/ {
            set $hub_api http://hub-api:8000;
            proxy_pass $hub_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ^~ /healthz/ {
            set $hub_api http://hub-api:8000;
            proxy_pass $hub_api;
            proxy_set_header Host $host;
        }

        # UI Angular (build estatico de `ng build`, ver README.md #15/#17).
        location / {
            root /usr/share/nginx/html/ui;
            try_files $uri $uri/ /index.html;
        }

        # index.html referencia los bundles JS/CSS por nombre con hash de
        # contenido (main-<hash>.js, chunk-<hash>.js...); ese hash es lo que
        # permite cachear esos archivos para siempre SIN riesgo, porque un
        # contenido nuevo siempre tiene un nombre nuevo. Pero eso solo
        # funciona si el propio index.html nunca se sirve de una cache vieja
        # -- sin este header, un navegador podia quedarse indefinidamente con
        # un index.html viejo (apuntando a bundles que ya no existen) sin
        # pedir el nuevo nunca, aunque el deploy en el server ya estuviera
        # actualizado (bug real encontrado 2026-08-18: varios redeploys
        # seguidos que el operador no veia reflejados en el navegador).
        location = /index.html {
            root /usr/share/nginx/html/ui;
            add_header Cache-Control "no-cache";
        }
    }
}
